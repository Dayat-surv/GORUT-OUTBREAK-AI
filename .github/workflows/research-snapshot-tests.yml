name: Research snapshot and release smoke tests

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'premium.css'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'backend-config.js'
      - 'tests/**'
      - '.github/workflows/research-snapshot-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'premium.css'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'backend-config.js'
      - 'tests/**'
      - '.github/workflows/research-snapshot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run research snapshot regression tests
        run: node tests/research-snapshot-valid-case.test.js
      - name: Run release smoke tests
        run: node tests/release-smoke.test.js
