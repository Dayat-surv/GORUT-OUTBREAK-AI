name: Research snapshot regression tests

on:
  pull_request:
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/research-snapshot-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/research-snapshot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-snapshot-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run research snapshot regression test
        run: node tests/research-snapshot-valid-case.test.js
