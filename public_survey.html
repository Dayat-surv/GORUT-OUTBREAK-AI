<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GORUT-OUTBREAK AI — Public Survey v12 — v74</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px}label{font-weight:bold;font-size:13px;display:block;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3dc;border-radius:7px;box-sizing:border-box}.primary{background:#1769aa;color:white;border:0;padding:11px 15px;border-radius:7px}.notice{background:#eff6ff;padding:10px;border-left:4px solid #1769aa}.q{margin-bottom:14px}</style></head><body><div class="wrap"><div class="card"><h1 id="title">Kuesioner Investigasi</h1><div id="status" class="notice">Memuat kuesioner...</div></div><form id="form" class="card"></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="backend-config.js" onerror="window.GORUT_BACKEND={enabled:false}"></script><script>let sb=null,survey=null,questionnaire=null;const qs=new URLSearchParams(location.search);const token=qs.get('survey');const offlineQueueKey='gorut-public-outbox-v12';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uuid(){return crypto?.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3)|8;return v.toString(16)})}
function pickAnswer(payload,labels){const qs=questionnaire?.schema_json?.questions||[];for(const q of qs){const label=String(q.label||'').toLowerCase();if(labels.some(x=>label===String(x).toLowerCase()||label.includes(String(x).toLowerCase()))){const v=payload[q.id];if(v!==undefined&&v!=='')return v}}return ''}
function responseUuid(responseId){const s=String(responseId||'');if(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s))return s;let h='';for(let i=0;i<32;i++){const c=s.charCodeAt(i%s.length)||65;h+=(c*2654435761>>>0).toString(16).padStart(8,'0')}h=h.slice(0,32);return `${h.slice(0,8)}-${h.slice(8,12)}-4${h.slice(13,16)}-8${h.slice(17,20)}-${h.slice(20,32)}`}
async function createCaseFromPayload(payload,responseId){if(!responseId)return {error:{message:'response_id tidak tersedia'}};const caseId=responseUuid(responseId);const caseRow={id:caseId,investigation_id:survey.investigation_id,case_code:'PUB-'+String(responseId).replace(/[^A-Za-z0-9]/g,'').slice(0,18).toUpperCase(),full_name:pickAnswer(payload,['Nama lengkap','Nama']),age:Number(pickAnswer(payload,['Umur','Usia']))||null,sex:pickAnswer(payload,['Jenis kelamin','Jenis Kelamin']),onset_date:pickAnswer(payload,['Tanggal onset gejala','Tanggal onset','Onset']),status:pickAnswer(payload,['Status kasus'])||'Suspek',outcome:pickAnswer(payload,['Keadaan akhir','Outcome','Status kesehatan']),latitude:Number(pickAnswer(payload,['Latitude']))||null,longitude:Number(pickAnswer(payload,['Longitude']))||null,questionnaire_response:payload,metadata:{source:'public_survey',survey_id:survey.id,response_id:responseId,created_at:new Date().toISOString(),integrity_version:'v74'}};return await sb.from('cases').upsert(caseRow,{onConflict:'id'}).select('id').single()}
async function init(){const c=window.GORUT_BACKEND||{};if(!c.enabled||!window.supabase){status.textContent='Public survey online memerlukan backend yang dikonfigurasi.';return}sb=window.supabase.createClient(c.url,c.anonKey);let r=await sb.from('public_surveys').select('id,title,questionnaire_id,investigation_id,expires_at').eq('public_token',token).eq('is_active',true).single();if(r.error){status.textContent='Kuesioner tidak ditemukan atau sudah tidak aktif.';return}if(r.data.expires_at&&new Date(r.data.expires_at)<new Date()){status.textContent='Kuesioner sudah kedaluwarsa.';return}survey=r.data;title.textContent=survey.title;r=await sb.from('questionnaires').select('name,version,schema_json').eq('id',survey.questionnaire_id).single();if(r.error){status.textContent='Instrumen tidak tersedia.';return}questionnaire=r.data;status.textContent='Versi instrumen: '+questionnaire.version;render();flushOffline()}
function render(){const qs=questionnaire.schema_json.questions||[];form.innerHTML=qs.map((q,i)=>{let input=q.type==='textarea'?`<textarea name="${esc(q.id)}" ${q.required?'required':''}></textarea>`:q.type==='choice'?`<select name="${esc(q.id)}" ${q.required?'required':''}><option value="">Pilih...</option>${(q.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input type="${q.type==='number'?'number':q.type==='date'?'date':'text'}" name="${esc(q.id)}" ${q.required?'required':''}>`;return `<div class="q" data-qid="${esc(q.id)}"><label>${i+1}. ${esc(q.label)} ${q.required?'*':''}</label>${input}</div>`}).join('')+'<button class="primary" type="submit">Kirim Kuesioner</button>';bindConditionals()}
function bindConditionals(){const blocks=[...form.querySelectorAll('.q')];const rules=questionnaire.schema_json.meta?.conditionalRules||[];function apply(){blocks.forEach(b=>b.style.display='block');rules.forEach(r=>{const source=blocks.find(b=>b.dataset.qid===r.whenId);const target=blocks.find(b=>b.dataset.qid===r.revealId);if(!source||!target)return;const v=source.querySelector('input,select,textarea')?.value||'';target.style.display=r.values?.some(x=>String(v).toLowerCase().includes(String(x).toLowerCase()))?'block':'none'})}form.addEventListener('change',apply);apply()}
form.addEventListener('submit',async e=>{e.preventDefault();const payload=Object.fromEntries(new FormData(form).entries());const btn=form.querySelector('button');if(btn)btn.disabled=true;const r=await sb.from('survey_responses').insert({survey_id:survey.id,respondent_device:navigator.userAgent.slice(0,180),payload}).select('id').single();if(r.error){const out=JSON.parse(localStorage.getItem(offlineQueueKey)||'[]');out.push({survey_id:survey.id,payload,savedAt:new Date().toISOString()});localStorage.setItem(offlineQueueKey,JSON.stringify(out));status.textContent='Koneksi gagal. Respons disimpan sementara di perangkat. Buka kembali saat koneksi tersedia untuk mengirim ulang.';if(btn)btn.disabled=false}else{const cr=await createCaseFromPayload(payload,r.data?.id);if(cr.error){status.textContent='Respons tersimpan, tetapi pembuatan kasus otomatis belum berhasil: '+cr.error.message;form.innerHTML='<div class="notice"><b>Respons kuesioner sudah tersimpan.</b> Kasus belum berhasil masuk ke Daftar Kasus. Periksa kebijakan akses backend (RLS) atau gunakan trigger backend v74.</div>'}else{form.innerHTML='<div class="notice"><b>Terima kasih.</b> Respons, <b>Case ID otomatis</b>, dan seluruh jawaban kuesioner telah tersimpan. Data dapat masuk ke Daftar Kasus setelah sinkronisasi aplikasi.</div>';status.textContent='Respons berhasil diterima dan kasus dibuat/di-upsert secara idempoten.'}}});
async function flushOffline(){const out=JSON.parse(localStorage.getItem(offlineQueueKey)||'[]');if(!out.length||!sb)return;const remain=[];for(const x of out){const r=await sb.from('survey_responses').insert({survey_id:x.survey_id,respondent_device:'offline-queue',payload:x.payload}).select('id').single();if(r.error){remain.push(x);continue}const cr=await createCaseFromPayload(x.payload,r.data?.id);if(cr.error){x.response_id=r.data?.id;x.case_error=cr.error.message;remain.push(x)}}localStorage.setItem(offlineQueueKey,JSON.stringify(remain));if(!remain.length&&out.length)status.textContent='Antrian offline berhasil disinkronkan.'}
window.addEventListener('online',flushOffline);init();</script></body></html>
