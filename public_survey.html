<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GORUT-OUTBREAK AI — Kuesioner Publik</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 10px #1720330a}label{font-weight:bold;font-size:13px;display:block;margin:12px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3dc;border-radius:7px;box-sizing:border-box;font:inherit}.primary{background:#1769aa;color:white;border:0;padding:11px 15px;border-radius:7px;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.notice{background:#eff6ff;padding:10px;border-left:4px solid #1769aa;border-radius:4px}.q{margin-bottom:14px}.muted{color:#596579;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="surveyTitle">Kuesioner Investigasi</h1>
    <div id="status" class="notice" role="status">Memuat kuesioner...</div>
  </div>
  <form id="surveyForm" class="card"></form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="backend-config.js" onerror="window.GORUT_BACKEND={enabled:false}"></script>
<script>
'use strict';
let sb=null, survey=null, questionnaire=null;
const params=new URLSearchParams(location.search);
const token=params.get('survey')||'';
const queueKey='gorut-public-outbox-v13';
const statusEl=document.getElementById('status');
const titleEl=document.getElementById('surveyTitle');
const form=document.getElementById('surveyForm');

function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function setStatus(message){statusEl.textContent=message;}
function readQueue(){try{const q=JSON.parse(localStorage.getItem(queueKey)||'[]');return Array.isArray(q)?q:[]}catch(_){return[]}}
function writeQueue(q){localStorage.setItem(queueKey,JSON.stringify(q));}
function render(){
  const questions=Array.isArray(questionnaire?.schema_json?.questions)?questionnaire.schema_json.questions:[];
  if(!questions.length){form.innerHTML='<p>Instrumen ini belum memiliki pertanyaan yang dapat ditampilkan.</p>';return;}
  form.innerHTML=questions.map((q,i)=>{
    const id=String(q.id||'q'+i), label=String(q.label||('Pertanyaan '+(i+1)));
    const required=q.required?'required':'';
    let input='';
    if(q.type==='textarea') input='<textarea name="'+esc(id)+'" '+required+'></textarea>';
    else if(q.type==='choice') input='<select name="'+esc(id)+'" '+required+'><option value="">Pilih...</option>'+((q.options||[]).map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join(''))+'</select>';
    else input='<input type="'+(q.type==='number'?'number':q.type==='date'?'date':'text')+'" name="'+esc(id)+'" '+required+'>';
    return '<div class="q" data-qid="'+esc(id)+'"><label for="'+esc(id)+'">'+(i+1)+'. '+esc(label)+(q.required?' *':'')+'</label>'+input+'</div>';
  }).join('')+'<button class="primary" type="submit">Kirim Kuesioner</button><p class="muted">Jika koneksi terputus, jawaban dapat disimpan sementara pada perangkat ini.</p>';
  bindConditionals();
}
function bindConditionals(){
  const blocks=[...form.querySelectorAll('.q')];
  const rules=questionnaire?.schema_json?.meta?.conditionalRules||[];
  function apply(){
    blocks.forEach(b=>{b.style.display='block';});
    rules.forEach(rule=>{
      const source=blocks.find(b=>b.dataset.qid===String(rule.whenId));
      const target=blocks.find(b=>b.dataset.qid===String(rule.revealId));
      if(!source||!target)return;
      const value=source.querySelector('input,select,textarea')?.value||'';
      target.style.display=(rule.values||[]).some(x=>String(value).toLowerCase().includes(String(x).toLowerCase()))?'block':'none';
    });
  }
  form.addEventListener('change',apply);
  apply();
}
async function init(){
  const config=window.GORUT_BACKEND||{};
  if(!config.enabled||!window.supabase){setStatus('Formulir online belum tersedia karena backend belum dikonfigurasi.');form.innerHTML='';return;}
  if(!token){setStatus('Token survei tidak ditemukan pada tautan.');form.innerHTML='';return;}
  sb=window.supabase.createClient(config.url,config.anonKey);
  const result=await sb.rpc('get_public_survey',{p_token:token});
  if(result.error||!result.data){setStatus('Kuesioner tidak ditemukan, tidak aktif, atau sudah kedaluwarsa.');form.innerHTML='';return;}
  survey=result.data;
  questionnaire={name:survey.name,version:survey.version,schema_json:survey.schema_json};
  titleEl.textContent=survey.title||'Kuesioner Investigasi';
  setStatus('Instrumen: '+(questionnaire.name||'Kuesioner')+' · Versi: '+(questionnaire.version||'-'));
  render();
  await flushOffline();
}
async function submitPayload(payload,device){
  return await sb.rpc('submit_public_survey',{
    p_token:token,
    p_payload:payload,
    p_respondent_device:String(device||'browser').slice(0,180)
  });
}
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(!sb||!survey){setStatus('Kuesioner belum siap dikirim.');return;}
  const payload=Object.fromEntries(new FormData(form).entries());
  const button=form.querySelector('button[type="submit"]');
  if(button)button.disabled=true;
  const result=await submitPayload(payload,navigator.userAgent);
  if(result.error){
    const queue=readQueue();
    queue.push({token,payload,device:navigator.userAgent,savedAt:new Date().toISOString()});
    writeQueue(queue);
    setStatus('Pengiriman belum berhasil. Respons disimpan sementara pada perangkat ini; sambungkan kembali ke internet untuk mencoba mengirim ulang.');
    if(button)button.disabled=false;
    return;
  }
  form.innerHTML='<div class="notice"><b>Terima kasih.</b> Respons kuesioner telah diterima dan diproses oleh server.</div>';
  setStatus('Respons berhasil dikirim.');
});
async function flushOffline(){
  if(!sb||!navigator.onLine)return;
  const queue=readQueue();
  if(!queue.length)return;
  const remain=[];
  for(const item of queue){
    const result=await sb.rpc('submit_public_survey',{
      p_token:item.token,
      p_payload:item.payload,
      p_respondent_device:String(item.device||'offline-queue').slice(0,180)
    });
    if(result.error)remain.push(item);
  }
  writeQueue(remain);
  if(queue.length&&!remain.length)setStatus('Antrian offline berhasil dikirim ke server.');
  else if(remain.length)setStatus('Sebagian respons masih menunggu koneksi atau validasi server; respons tetap tersimpan di perangkat ini.');
}
window.addEventListener('online',flushOffline);
init().catch(()=>setStatus('Terjadi kesalahan saat memuat kuesioner. Silakan coba kembali.'));
</script>
</body>
</html>
